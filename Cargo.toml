[package]
name = "game"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 2
